<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictado (prueba)</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    body { margin: 0; background: #f4f4f8; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 1.6rem; }
    p { margin: 0; color: #555; }
    .fila { display: flex; gap: 12px; align-items: center; }
    select { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #ccc; }
    .voz-boton { min-width: 64px; min-height: 64px; border-radius: 50%; }
    pre { margin: 0; padding: 14px; background: #fff; border-radius: 12px; white-space: pre-wrap; min-height: 3em; }
  </style>
</head>
<body>
  <main>
    <h1>Dictado (prueba)</h1>
    <p>Página para probar el servicio de voz que usan la lista de compras, la pizarra y la cocina. Toca el micrófono, habla y vuelve a tocarlo.</p>
    <div class="fila" id="fila">
      <select id="modo">
        <option value="lista">Modo lista</option>
        <option value="texto">Solo texto</option>
      </select>
    </div>
    <pre id="salida"></pre>
  </main>
  <script src="voz.js"></script>
  <script>
    const salida = document.getElementById("salida");
    const fila = document.getElementById("fila");
    let actual = null;
    function poner() {
      if (actual) actual.remove();
      actual = Voz.boton({
        modo: document.getElementById("modo").value,
        alTerminar: (d) => { salida.textContent = JSON.stringify(d, null, 2); },
        alError: (m) => { salida.textContent = "⚠ " + m; },
      });
      fila.prepend(actual);
    }
    document.getElementById("modo").addEventListener("change", poner);
    poner();
  </script>
</body>
</html>
